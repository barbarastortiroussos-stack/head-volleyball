<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ghost Volleyball</title>

    <!-- SDK da Y8 Games (Opcional, mas necessário para Leaderboards/Highscores) -->
    <script src="https://a.y8.com/api/js/v2/y8.js"></script>

    <style>
        /* RESET BÁSICO */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0D0D0D;
            color: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Correções essenciais para responsividade e toque */
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 800px;
            max-height: 600px;
            aspect-ratio: 4 / 3;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            touch-action: manipulation;
        }

        /* PLACAR */
        #scoreBoard {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2rem;
            font-weight: bold;
            color: #00F5D4;
            text-shadow: 0 0 10px rgba(0, 245, 212, 0.5);
            z-index: 5;
        }

        /* CONTROLES DO CABEÇALHO */
        #topControls {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 10px;
            z-index: 5;
        }

        .icon-btn {
            background: rgba(43, 11, 20, 0.7);
            border: 1px solid #6B0F24;
            color: #FFFFFF;
            font-size: 1.2rem;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .icon-btn:hover {
            background: #6B0F24;
        }

        /* TELAS DE OVERLAY (START, PAUSE, GAME OVER) */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 13, 13, 0.88);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 2.8rem;
            color: #00F5D4;
            text-shadow: 0 0 15px rgba(0, 245, 212, 0.4);
            letter-spacing: 2px;
        }

        h2 {
            font-size: 2.2rem;
            color: #E60067;
            text-shadow: 0 0 10px rgba(230, 0, 103, 0.4);
        }

        .menu-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 220px;
        }

        .menu-group label {
            font-size: 0.9rem;
            color: #A0A0A0;
        }

        select {
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #6B0F24;
            background: #2B0B14;
            color: #FFF;
            font-size: 1rem;
            outline: none;
        }

        .btn {
            padding: 12px 32px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #0D0D0D;
            background: #00F5D4;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(0, 245, 212, 0.4);
            transition: transform 0.1s, background 0.2s;
        }

        .btn:hover {
            background: #00d6b9;
            transform: scale(1.03);
        }

        /* CONTROLES TOUCH MÓVEIS */
        #touchControls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 5;
        }

        .touch-left-group, .touch-right-group {
            display: flex;
            gap: 10px;
            pointer-events: auto; /* Permite clicar nos botões dentro dos grupos */
        }

        .touch-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: rgba(43, 11, 20, 0.6);
            border: 1px solid rgba(0, 245, 212, 0.3);
            color: white;
            font-size: 1.4rem;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
            cursor: pointer;
        }

        /* Oculta os botões em telas grandes (PCs/Notebooks) */
        @media (min-width: 801px) {
            #touchControls {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <!-- Canvas onde o jogo é renderizado (800x600) -->
        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <!-- Placar do Jogo -->
        <div id="scoreBoard">
            <span id="playerScore">0</span> : <span id="cpuScore">0</span>
        </div>

        <!-- Botões do Cabeçalho (Pausa e Mute) -->
        <div id="topControls">
            <button id="pauseBtn" class="icon-btn">⏸️</button>
            <button id="muteBtn" class="icon-btn">🔊</button>
        </div>

        <!-- Tela Inicial / Menu Start -->
        <div id="startScreen" class="overlay">
            <h1>GHOST VOLLEYBALL</h1>
            
            <div class="menu-group">
                <label for="gender">Gênero:</label>
                <select id="gender">
                    <option value="male">Masculino</option>
                    <option value="female">Feminino</option>
                </select>
            </div>

            <div class="menu-group">
                <label for="difficulty">Dificuldade:</label>
                <select id="difficulty">
                    <option value="easy">Fácil</option>
                    <option value="medium" selected>Médio</option>
                    <option value="hard">Difícil</option>
                </select>
            </div>

            <button id="startBtn" class="btn">JOGAR</button>
        </div>

        <!-- Tela de Pausa -->
        <div id="pauseScreen" class="overlay hidden">
            <h2>JOGO PAUSADO</h2>
            <button id="resumeBtn" class="btn">CONTINUAR</button>
        </div>

        <!-- Tela de Game Over -->
        <div id="gameOverScreen" class="overlay hidden">
            <h2 id="gameOverTitle">YOU WIN!</h2>
            <p>Placar Final: <span id="finalScore">0 x 0</span></p>
            <button id="playAgainBtn" class="btn">JOGAR NOVAMENTE</button>
        </div>

        <!-- Controles Touch para Dispositivos Móveis -->
        <div id="touchControls">
            <div class="touch-left-group">
                <button id="btnLeft" class="touch-btn">⬅️</button>
                <button id="btnRight" class="touch-btn">➡️</button>
            </div>
            <div class="touch-right-group">
                <button id="btnJump" class="touch-btn">⬆️</button>
                <button class="icon-btn" id="fullscreenBtn" title="Tela Cheia">⛶</button>
            </div>
        </div>
    </div>

    <!-- Importação do arquivo de lógica do jogo -->
    <script src="game.js"></script>
</body>
</html>
