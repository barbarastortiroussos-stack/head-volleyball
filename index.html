<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Volleyball</title>
    <style>
        body { 
            margin: 0; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            background-color: #1a1a1a; 
            color: white; 
            font-family: Arial, sans-serif; 
            user-select: none;
        }

        /* Container que segura o Canvas e os Menus centralizados */
        #gameContainer {
            position: relative;
            width: 800px;
            height: 600px;
        }

        canvas { 
            border: 4px solid #fff; 
            background-color: #87CEEB; /* Cor do céu */
            display: block;
        }

        /* Placar no topo */
        #ui { 
            position: absolute; 
            top: 15px; 
            width: 100%; 
            text-align: center; 
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }

        /* Estilo para Telas/Overlays (Menu e Pausa) */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            border: 4px solid #fff;
            box-sizing: border-box;
        }

        .overlay h1 {
            font-size: 36px;
            margin-bottom: 10px;
            color: #FFDC00;
        }

        .overlay label {
            font-size: 18px;
        }

        .overlay select, .overlay button {
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }

        .overlay button {
            background-color: #2ECC40;
            color: white;
            font-weight: bold;
            font-size: 20px;
            margin-top: 10px;
            transition: 0.2s;
        }

        .overlay button:hover {
            background-color: #01FF70;
            color: black;
            transform: scale(1.05);
        }

        /* Classe para esconder elementos facilmente */
        .hidden {
            display: none !important;
        }

        /* Controles Touch para Mobile */
        #touchControls {
            display: flex;
            justify-content: space-between;
            width: 800px;
            margin-top: 15px;
        }

        .touch-group {
            display: flex;
            gap: 10px;
        }

        .btn-touch {
            width: 70px;
            height: 70px;
            background-color: rgba(255, 255, 255, 0.2);
            border: 2px solid #fff;
            border-radius: 50%;
            color: white;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
        }

        .btn-touch:active {
            background-color: rgba(255, 255, 255, 0.5);
        }
        /* Ajuste automático para telas pequenas (Celular) */
@media (max-width: 820px) {
    #gameContainer {
        width: 95vw;
        height: calc(95vw * 0.75); /* Mantém a proporção 4:3 do Canvas (800x600) */
    }

    canvas {
        width: 100% !important;
        height: 100% !important;
    }

    #touchControls {
        width: 95vw;
        margin-top: 10px;
    }

    .btn-touch {
        width: 60px;
        height: 60px;
        font-size: 20px;
    }
}
    </style>
</head>
<body>

    <div id="gameContainer">
        <!-- O Canvas do Jogo -->
        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <!-- Placar -->
        <div id="ui">
            Scoreboard: <span id="playerScore">0</span> x <span id="cpuScore">0</span>
        </div>

        <!-- Tela do Menu Inicial -->
        <!-- Tela do Menu Inicial -->
<div id="startScreen" class="overlay">
    <h1>GHOST VOLLEYBALL</h1> 
    
    <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
    </select>

    <button id="startBtn">PLAY</button>
</div>

        <!-- Tela de Pausa -->
        <div id="pauseScreen" class="overlay hidden">
            <h1>Paused</h1>
            <p>Press 'P' or click below to continue</p>
            <button id="resumeBtn">Continue</button>
        </div>
    </div>

    <!-- Controles de Toque para Celular -->
    <div id="touchControls">
        <div class="touch-group">
            <button class="btn-touch" id="btnLeft">◄</button>
            <button class="btn-touch" id="btnRight">►</button>
        </div>
        <div class="touch-group">
            <button class="btn-touch" id="btnJump">▲</button>
        </div>
    </div>

    <script src="game.js"></script>

    /* Impede zoom duplo toque e seleções no mobile */
body, .btn-touch, button {
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
}
</body>
</html>
